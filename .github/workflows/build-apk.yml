name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Run the official Kivy buildozer image directly instead of a
      # third-party wrapper action: the ArtemSBulgakov/buildozer-action image
      # layers on an `add-apt-repository ppa:openjdk-r/ppa` step that 404s
      # (an abandoned Launchpad PPA, unrelated to this repo). The official
      # image already ships a working JDK, so we skip that layer entirely.
      - name: Build APK with buildozer (official Kivy Docker image)
        run: |
          # The image runs as a non-root user; let it write .buildozer/ and bin/
          # into the bind-mounted checkout.
          chmod -R a+rwX "${{ github.workspace }}"
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Locate built APK
        id: find_apk
        run: |
          apk_path=$(find bin -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then echo "::error::No APK produced in bin/"; exit 1; fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: okf-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
