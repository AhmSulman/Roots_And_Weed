name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install desktop requirements (Kivy/KivyMD/NumPy only)
        run: |
          python -m pip install --upgrade pip
          pip install kivy>=2.3.0 kivymd>=1.2.0 numpy pyinstaller
        # NOTE: torch/demucs are intentionally not installed here to keep CI
        # fast/reliable. Real Demucs separation still works when a user runs
        # `pip install -r requirements-desktop.txt` locally; the CI-built exe
        # will report the DSP fallback until those are bundled in a release
        # build. See okf/ALGORITHM_NOTES.md.

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name OKF `
            --add-data "okf.kv;." `
            --add-data "okf;okf" `
            main.py

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: okf-windows
          path: dist/OKF
          retention-days: 30
